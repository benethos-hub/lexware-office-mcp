# In operation: the published image from the GitHub container registry,
# nothing built. This folder is all it needs - this file and an .env beside
# it, made from .env.example, which names the version. README.md beside it
# says how to get the folder and run it.
#
#   docker compose up -d                     start the server
#   docker compose --profile setup up -d     add the configuration interface
#   docker compose rm -f -s setup            take the interface away again
#   docker compose logs -f                   follow what it says
#   docker compose down                      stop everything
#
# `rm -f -s setup` rather than `--profile setup down`: down is the whole
# project and takes the server with it, which is not what "close the settings
# page" should mean.
#
# The configuration interface is behind a profile on purpose. It has no login,
# it accepts an API key, and it is needed for minutes rather than months. A
# profile is not started by a plain `up`, so leaving it out of the file would
# be the only stronger statement. **Nothing stops it for you** - no restart
# policy brings it back, and no command removes it unless you run one.

# The name the Compose file in the repository root had, so the volumes it
# made - the key, the token, the tools - are this project's as well.
name: benethos-lexware-office-mcp

# What Docker keeps of a container's output, at most: five files of 10 MB,
# the oldest dropped first. Without it the json-file driver keeps everything
# for as long as the container exists, and a restart - `unless-stopped`, or
# the server ending on a changed .env - is the same container. The server
# writes a line for every request it refuses, and at DEBUG for every one it
# receives, on stderr beside its own log, so a port that is reachable grows
# the log whether or not anyone is using it. 50 MB is weeks of ordinary use.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  benethos-lexware-office-mcp:
    # The version is the one LXO_VERSION in .env names. To update, change it
    # there, then `docker compose pull && docker compose up -d`.
    image: ghcr.io/benethos-hub/benethos-lexware-office-mcp:${LXO_VERSION:?set LXO_VERSION in .env, see .env.example}
    container_name: benethos-lexware-office-mcp
    ports:
      # bind:host:container. Published on the loopback interface of the host,
      # because a bearer token is a guard against other processes on this
      # machine and not a reason to put an accounting API on a network. Drop
      # the 127.0.0.1 prefix only behind a proxy that authenticates for you.
      - "127.0.0.1:${LXO_PORT:-8770}:8770"
    restart: unless-stopped
    logging: *logging
    environment:
      # No bearer token here on purpose. The container makes one on first
      # start and keeps it in the config volume, and the configuration
      # interface shows and changes it. Setting it here would work - and
      # would then beat the volume, so the page could no longer change it.
      #
      # Owned by the container and pinned here, because `environment` beats
      # anything in the config volume: a .env that was written for local stdio
      # use cannot turn the container into something the published port cannot
      # reach.
      LXO_MCP_TRANSPORT: streamable-http
      LXO_MCP_HTTP_HOST: "0.0.0.0"
      LXO_MCP_HTTP_PORT: "8770"
      # The service's own name, so a second container on this network can
      # talk to it. The loopback names stay allowed either way, on any port.
      LXO_MCP_ALLOWED_HOSTS: "benethos-lexware-office-mcp:8770"
      # Settings are read once, at startup. This ends the process when
      # /config/.env changes, and `restart: unless-stopped` brings it back with
      # the new ones - which is what makes configuring in the browser enough.
      LXO_MCP_EXIT_ON_CONFIG_CHANGE: "1"
      # Nothing else belongs here. A variable set in this block is a real
      # environment variable and therefore beats the config volume, so a
      # setting pinned by habit rather than by need is one the configuration
      # interface can no longer change.
    volumes:
      # The .env, the policy file and the saved permission profiles.
      - config:/config
      # Documents fetched from the API, the newest 100 of them: the image sets
      # LXO_MCP_KEPT_DOWNLOADS. Set it under `environment` to change that.
      - downloads:/downloads
    # Nothing is written but the two volumes and /tmp, which lives in memory:
    # the image, the code in it included, stays as it was pulled. No Linux
    # capability is kept, since a process of uid 10001 on a port above 1024
    # needs none, and nothing can gain one later through a setuid binary.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # Started by name, never by a plain `up`:
  #   docker compose --profile setup up -d
  # Then open http://127.0.0.1:8771/, enter the key, tick the tools. The
  # server notices the changed file and restarts itself. Then put this one
  # away again, by hand, because nothing else will:
  #   docker compose rm -f -s setup
  setup:
    profiles: ["setup"]
    # The same image as above, serving its other command. Two versions of one
    # image against one volume is not a state anything here expects.
    image: ghcr.io/benethos-hub/benethos-lexware-office-mcp:${LXO_VERSION:?set LXO_VERSION in .env, see .env.example}
    container_name: benethos-lexware-office-mcp-setup
    command:
      - setup
      - --no-browser
      # Binding the container's loopback would make the published port answer
      # nothing. What keeps this reachable from this machine only is the
      # 127.0.0.1 in the publish below.
      - --host
      - "0.0.0.0"
      - --port
      - "8771"
      - --env-file
      - /config/.env
      - --tools-file
      - /config/tools.json
    ports:
      - "127.0.0.1:${LXO_SETUP_PORT:-8771}:8771"
    # The image checks the transport port, which this one does not serve. A
    # page a person is looking at reports its own health well enough.
    healthcheck:
      disable: true
    # No restart policy: this is meant to be stopped when you are done, and a
    # page that takes an API key should not come back by itself.
    restart: "no"
    logging: *logging
    volumes:
      - config:/config
      - downloads:/downloads
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  config:
  downloads:
