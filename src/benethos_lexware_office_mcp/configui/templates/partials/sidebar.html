{# The navigation, and the account the last connection test found: which
   records these permissions are about has to stay in view. #}
<aside class="sidebar">
  <div class="brand">Lexware Office MCP</div>
  <nav class="nav">
  {% for href, label in navigation %}
    <a href="{{ href }}"{% if href == here %} class="active" aria-current="page"{% endif %}>{{ label }}</a>
  {% endfor %}
  </nav>
  <div class="spacer"></div>
  {% if account %}
  <div class="foot">Konto: {{ account.label }}</div>
  {% endif %}
</aside>
