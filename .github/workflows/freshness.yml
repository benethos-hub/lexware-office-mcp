name: Freshness

# Two questions about the versions, answered once a day in one run and two
# issues, through the organisation's reusable freshness workflow
# (docs/freshness.md in benethos-hub/.github). Nothing here commits, the
# upgraded lockfile stays in the runner.
#
#   "Pinned versions have newer releases", the organisation's report: every
#   package uv.lock pins that has a newer release, within the ranges
#   pyproject.toml allows and beyond them, the build backend, known
#   vulnerabilities with the same waivers as the CI, python and uv in the
#   Dockerfile by digest and by tag, every image of the compose files with
#   a digit in its tag, every action pinned to a commit, and under Checks
#   one sentence per job below on what passed. Dependabot proposes the
#   direct dependencies, the actions and the images of the Dockerfile. The
#   issue adds the packages beneath them, the versions beyond a range, the
#   rebuilds of a base image under the same tag and the one place to see
#   all of it.
#
#   "Newest dependency versions break the server", this repository's
#   question. uvx without a pin and pip install resolve the newest versions
#   pyproject.toml allows, not the ones in uv.lock, so what a user runs can
#   change on any day without a release here. Two jobs feed it: newest, the
#   organisation's ready-made job of the repository, upgrades the lockfile
#   inside the runner, runs the suite on those versions and then
#   tests/stdio_check.py, the server spoken to over stdio as a client does,
#   without a key. index, a job of the organisation's workflow, installs the
#   published release from PyPI into a fresh environment, the path uvx
#   takes, and runs the same check with its interpreter. A run that proves
#   nothing, the check failing on the locked versions too or a step failing
#   while nothing moved, leaves the alarm issue as it was.
#
# Both issues are public: names, versions and the result of a job go in, no
# log. The cron, the concurrency group and the permission to write issues
# belong here, the measuring belongs to the organisation. The workflow and
# the action are followed at main, unpinned, for the reason given in
# ci.yml. Nothing here is a required check, nothing runs for a pull request.

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freshness

jobs:
  # The suite is offline and needs no key, so it runs as it is. The stdio
  # check is what the suite cannot see: the SDK's conversion of a result
  # and an error on the way to the client, see SPECS.md section 14.3.
  newest:
    name: Newest versions allowed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the newest versions allowed
        uses: benethos-hub/.github/actions/python/freshness-newest@main
        with:
          findings: ${{ runner.temp }}/freshness/newest
          extras: dev
          check: uv run --frozen python tests/stdio_check.py

      - name: Leave the result for the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freshness-newest
          path: ${{ runner.temp }}/freshness/newest
          retention-days: 7

  # Runs whatever happened before: a job that died before its upload is a
  # line in the pins report, not a silent gap, since extra-jobs names it.
  freshness:
    name: Freshness report
    needs: newest
    if: ${{ !cancelled() }}
    uses: benethos-hub/.github/.github/workflows/freshness.yml@main
    permissions:
      contents: read
      issues: write
    with:
      issue-title: Pinned versions have newer releases
      extra-jobs: newest
      alarm-title: Newest dependency versions break the server
      alarm-resolved: The newest dependency versions work.
      index: true
      index-check: $FRESHNESS_PYTHON tests/stdio_check.py
