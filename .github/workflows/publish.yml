name: Publish

# Publishes the release artefacts when a GitHub release is published:
#   * the sdist and the wheel to PyPI, through Trusted Publishing
#   * the container image to ghcr.io, through the automatic GITHUB_TOKEN
#   * the Claude Desktop bundle (.mcpb), attached to the release itself
#   * the entry in the MCP Registry, which points at all three, through the
#     workflow's OIDC identity
#
# The package jobs and the bundle are independent, so a broken image push
# does not withhold the upload to PyPI and none waits on another. The registry
# job waits on all three, because the registry checks every package the
# moment it accepts the entry, the bundle's download and checksum included.
#
# `workflow_dispatch` runs the image half alone and tags the result `edge`,
# from `main` only: `edge` is public, and the form offers every branch.
# PyPI is skipped there: a version may be uploaded to PyPI exactly once, and a
# manual run carries no release tag it could legitimately claim a version from.
#
# Authentication is Trusted Publishing, which exchanges the workflow's OIDC
# identity for a short-lived token. **No API token is stored anywhere in this
# repository**, which matters for a project whose whole subject is not
# leaving credentials lying around.
#
# One-time setup on PyPI, by the account that will own the project. Under
# "Publishing" add a pending publisher with exactly:
#
#     PyPI project name: benethos-lexware-office-mcp
#     Owner:             benethos-hub
#     Repository:        lexware-office-mcp
#     Workflow filename: publish.yml
#     Environment:       pypi-benethos-lexware-office-mcp
#
# All five have to match or the upload is refused, and the environment below
# is the one it names: pypi- and the package's name. On GitHub it is under
# Settings -> Environments. For a project that exists already, the publisher
# is added the same way, without the project name.
#
# The registry needed no setup, measured on 2026-08-22 with the first push:
# the package came out public and was pulled with no login and no account,
# even though the documented behaviour is that a new package is private until
# switched. If a pull ever does come back unauthorized, that switch is under
# Packages -> Package settings -> Change visibility.
#
# Every action is pinned to a commit, its version beside it for the reader
# and for Dependabot, which raises both. This job holds the identity PyPI
# trusts and the right to push the image, and a tag is a pointer its
# publisher can move.
#
# The release process itself is in SPECS.md section 16.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pypi-publish:
    name: Build and publish to PyPI
    # A manual run has no version to publish, and PyPI refuses a re-upload.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi-benethos-lexware-office-mcp
      url: https://pypi.org/p/benethos-lexware-office-mcp
    # A job's permissions replace the workflow's, so contents: read is
    # repeated here or checkout would rely on the repository being public.
    permissions:
      contents: read
      id-token: write # Trusted Publishing, in place of a stored token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Before anything is built: a tag that is not the version in
      # pyproject.toml has PyPI refuse the upload, while the image job would
      # push the tag's version with the old code.
      - name: The release tag is the package version
        run: python3 .github/scripts/tag_matches_version.py

      # No `enable-cache` on purpose. The action's default disables the cache
      # for a `release` event, which is exactly this job: it holds the OIDC
      # identity that uploads to PyPI, and a restored cache is one more thing
      # that would have to be trusted. It installs almost nothing anyway.
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Build sdist and wheel
        run: uv build

      # The wheel is what a user installs, and it has been wrong before: the
      # settings sample lived beside the package and was never packed. Assert
      # it is in there rather than finding out from a bug report.
      - name: The wheel carries what it is supposed to
        run: |
          python - <<'PY'
          import pathlib, zipfile
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          names = zipfile.ZipFile(wheel).namelist()
          expected = [
              "benethos_lexware_office_mcp/env.sample",
              "benethos_lexware_office_mcp/py.typed",
              "benethos_lexware_office_mcp/server.py",
          ]
          missing = [n for n in expected if n not in names]
          assert not missing, f"{wheel.name} is missing {missing}"
          print(f"OK: {wheel.name}, {len(names)} files")
          PY

      - name: Publish to PyPI (Trusted Publishing)
        run: uv publish --trusted-publishing always

  ghcr-publish:
    name: Build and publish the image
    # A release, or a manual run on main. See the header.
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io as the GITHUB_TOKEN identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same check as the PyPI job. The two jobs are independent, so
      # each has to refuse on its own. A manual run carries no tag.
      - name: The release tag is the package version
        if: github.event_name == 'release'
        run: python3 .github/scripts/tag_matches_version.py

      # arm64 is emulated on an amd64 runner. Nothing in this image is compiled
      # from source - pypdfium2 ships a prebuilt PDFium for aarch64 and the rest
      # is pure Python - so the emulation only has to run an unpack.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags, labels and annotations
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # Annotate the index as well as the individual manifests. The default
          # is manifests only, and for a multi-architecture image the package
          # page reads the index - the manifest list above the per-architecture
          # manifests. Labels sitting in the image configuration are then
          # perfectly present and read by nothing, which is exactly how a
          # package page ends up saying "No description provided".
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index,manifest
        with:
          # The package's name, which is what the readback below inspects.
          # The repository's name carried the image until 0.4 and got its
          # patch releases, and none from 0.5.0 on.
          images: |
            ghcr.io/${{ github.repository_owner }}/benethos-lexware-office-mcp
          flavor: latest=false
          # `latest` is what a pull without a tag gets, so a pre-release never
          # becomes it. Its own version tag is still pushed.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: containers/images/lexware-office-mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Read the published index back. Setting the annotations above and
      # trusting them is what produced a description nobody could see, and the
      # cost of finding out is a release that has already happened.
      - name: The published index carries what the package page reads
        run: |
          ref=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -1)
          echo "inspecting $ref"
          docker buildx imagetools inspect "$ref" --raw > /tmp/index.json
          python3 - <<'PY'
          import json

          index = json.load(open("/tmp/index.json"))
          annotations = index.get("annotations") or {}
          platforms = sorted(
              f"{m['platform']['os']}/{m['platform']['architecture']}"
              for m in index.get("manifests", [])
              if m.get("platform", {}).get("architecture") != "unknown"
          )
          missing = [
              key
              for key in (
                  "org.opencontainers.image.description",
                  "org.opencontainers.image.source",
                  "org.opencontainers.image.version",
              )
              if not annotations.get(key)
          ]
          assert not missing, f"the index carries no {missing} - the package page shows nothing"
          assert "linux/amd64" in platforms, f"amd64 is missing, index holds {platforms}"
          assert "linux/arm64" in platforms, f"arm64 is missing, index holds {platforms}"
          print("OK:", ", ".join(platforms))
          print("   ", annotations["org.opencontainers.image.description"])
          PY

  mcpb-bundle:
    name: Attach the Claude Desktop bundle
    # The bundle goes onto the release it is built for, and a manual run has
    # no release to attach it to.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload the bundle as a release asset
    env:
      # Pinned like everything else here. Dependabot does not see a package
      # npx fetches, so the release checklist in CLAUDE.md raises it.
      MCPB_VERSION: 2.1.2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The write token is for the upload, nothing here pushes.
          persist-credentials: false

      - name: The release tag is the package version
        run: python3 .github/scripts/tag_matches_version.py

      - name: Stage the bundle
        run: python3 .github/publish/mcpb/build.py "$RUNNER_TEMP/bundle"

      - name: Validate and pack
        run: |
          set -euo pipefail
          npx --yes "@anthropic-ai/mcpb@${MCPB_VERSION}" validate "$RUNNER_TEMP/bundle/manifest.json"
          npx --yes "@anthropic-ai/mcpb@${MCPB_VERSION}" pack "$RUNNER_TEMP/bundle" \
            "benethos-lexware-office-mcp-${GITHUB_REF_NAME#v}.mcpb"

      # Twice: under its version, and without one, which gives the README a
      # link that always reaches the newest full release.
      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          versioned="benethos-lexware-office-mcp-${GITHUB_REF_NAME#v}.mcpb"
          cp "$versioned" benethos-lexware-office-mcp.mcpb
          gh release upload "$GITHUB_REF_NAME" "$versioned" benethos-lexware-office-mcp.mcpb

  mcp-registry-publish:
    name: Publish to the MCP Registry
    # An entry cannot be taken back, so a pre-release never gets one.
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: [pypi-publish, ghcr-publish, mcpb-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # the registry grants io.github.<owner>/* to this identity
    # Pinned with its checksum, from the release's own checksums file.
    # Dependabot does not see a download, so the release checklist in
    # CLAUDE.md raises it by hand.
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The release tag is the package version
        run: python3 .github/scripts/tag_matches_version.py

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher

      # The bundle's hash exists only now. The entry holds a placeholder,
      # and the hash is taken from the very file the release carries.
      - name: Fill in the bundle's checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bundle="benethos-lexware-office-mcp-${GITHUB_REF_NAME#v}.mcpb"
          gh release download "$GITHUB_REF_NAME" --pattern "$bundle" --dir "$RUNNER_TEMP"
          python3 .github/publish/mcp-registry/fill_bundle_checksum.py \
            .github/publish/mcp-registry/server.json "$RUNNER_TEMP/$bundle"

      - name: Log in with the workflow's OIDC token
        run: ./mcp-publisher login github-oidc

      # The registry reads the PyPI version through PyPI's JSON API, which
      # has reported a fresh upload as missing for minutes. Six tries a
      # minute apart outlast that.
      - name: Publish server.json
        run: |
          for attempt in 1 2 3 4 5 6; do
            if ./mcp-publisher publish .github/publish/mcp-registry/server.json; then
              exit 0
            fi
            echo "attempt ${attempt} refused, trying again in 60 s"
            sleep 60
          done
          exit 1
