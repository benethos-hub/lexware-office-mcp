name: Publish

# Publishes a release: the package to PyPI, the image to ghcr.io, the Claude
# Desktop bundle onto the release, and the entry in the MCP Registry. Each
# upload is done by an action of the organisation in benethos-hub/.github
# (actions/publish), followed at main like the CI workflows. Its README
# describes the gate, the trial run, the release tags and the one-time
# setup. What follows is what this project adds.
#
# PyPI trusts this file, publish.yml, together with the environment
# pypi-benethos-lexware-office-mcp. Renaming either has PyPI refuse the next
# upload.
#
# The image carries the package's name. The repository's name carried it
# until 0.4 and got the 0.4 patch releases, and nothing from 0.5.0 on.
#
# No API token is stored anywhere in this repository. PyPI and the MCP
# Registry take the workflow's OIDC identity, ghcr.io the automatic
# GITHUB_TOKEN.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Waits up to 30 minutes for the CI run of ci.yml on main for this commit,
  # and stops the release when that run failed, or after five minutes when
  # there is none. On a branch other than main nothing would be built, so it
  # does not run there. A waiver in ignore-vulns belongs here and in ci.yml
  # alike.
  ci-passed:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    uses: benethos-hub/.github/.github/workflows/python-release-ci-passed.yml@main
    permissions:
      actions: read # list the CI runs of this commit
      contents: read
    with:
      audit: true

  pypi-publish:
    name: Build and publish to PyPI
    # A version may be uploaded once only, so never by hand. The trial is
    # pypi-trial.
    if: github.event_name == 'release'
    needs: ci-passed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi-benethos-lexware-office-mcp
      url: https://pypi.org/p/benethos-lexware-office-mcp
    # A job's permissions replace the workflow's, so contents: read is
    # repeated here for the checkout.
    permissions:
      contents: read
      id-token: write # Trusted Publishing, in place of a stored token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The settings sample lived beside the package once and was never
      # packed, and the PEP 561 marker decides whether a type checker looks
      # at the installed package at all. Neither would fail a test or the
      # build.
      - uses: benethos-hub/.github/actions/publish/pypi@main
        with:
          wheel-contains: |
            benethos_lexware_office_mcp/env.sample
            benethos_lexware_office_mcp/py.typed
            benethos_lexware_office_mcp/server.py

  # The PyPI half of a manual run, without the environment and without an
  # OIDC token, since nothing is uploaded.
  pypi-trial:
    name: Build and check for PyPI (trial)
    if: github.event_name == 'workflow_dispatch'
    needs: ci-passed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: benethos-hub/.github/actions/publish/pypi@main
        with:
          dry-run: true
          wheel-contains: |
            benethos_lexware_office_mcp/env.sample
            benethos_lexware_office_mcp/py.typed
            benethos_lexware_office_mcp/server.py

  ghcr-publish:
    name: Build and publish the image
    # A release, or a manual run on main, which pushes edge. edge is public,
    # and the form offers every branch.
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    needs: ci-passed
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to ghcr.io as the GITHUB_TOKEN identity
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # arm64 is emulated on the amd64 runner. Nothing in this image is
      # compiled from source, pypdfium2 ships a prebuilt PDFium for aarch64
      # and the rest is pure Python. The arm64 build of the docker job in
      # ci.yml writes its layers to the cache scope buildkit, and the release
      # reads them from there.
      - uses: benethos-hub/.github/actions/publish/ghcr@main
        with:
          image: benethos-lexware-office-mcp
          dockerfile: containers/images/lexware-office-mcp/Dockerfile
          version-scheme: pep440
          version-file: pyproject.toml
          cache-scope: buildkit

  mcpb-bundle:
    name: Attach the Claude Desktop bundle
    # The bundle goes onto the release it is built for, and a manual run has
    # no release to attach it to.
    if: github.event_name == 'release'
    needs: ci-passed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload the bundle as a release asset
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The write token is for the upload, nothing here pushes.
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Stage the bundle
        run: uv run --no-project .github/publish/mcpb/build.py "$RUNNER_TEMP/bundle"

      # Attached twice, under its version and without, which gives the README
      # a link that always reaches the newest full release
      # (releases/latest/download/benethos-lexware-office-mcp.mcpb).
      - uses: benethos-hub/.github/actions/publish/mcpb@main
        with:
          staged: ${{ runner.temp }}/bundle
          name: benethos-lexware-office-mcp

  mcp-registry:
    name: Publish to the MCP Registry
    # The registry checks every package when it takes the entry: the README
    # of this version on PyPI must carry the mcp-name line, the image the
    # label, and the bundle must be downloadable and match its checksum. So
    # it runs only once all three are out. An entry cannot be taken back, so
    # a pre-release never gets one.
    if: github.event_name == 'release' && !github.event.release.prerelease
    needs: [pypi-publish, ghcr-publish, mcpb-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # the registry grants io.github.benethos-hub/* to this token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: benethos-hub/.github/actions/publish/mcp-registry@main
