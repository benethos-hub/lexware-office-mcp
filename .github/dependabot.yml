version: 2
updates:
  # The dependency ranges declared in pyproject.toml. `mcp` carries an upper
  # bound on purpose, so a major release arrives as a pull request to look at
  # rather than as a resolution nobody chose.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # The actions the workflows pin by major version.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # The base image of the Dockerfile. An out-of-date base is not a build
  # failure and never announces itself: it is unpatched system packages
  # inside something people pull and run. Nothing else here would notice.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
