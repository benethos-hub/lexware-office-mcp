version: 2
updates:
  # `uv`, not `pip`, because uv.lock is what actually pins a version here.
  # The pip ecosystem does not read that file, and every range in
  # pyproject.toml is a `>=`, so pip had nothing to raise either: the newest
  # release was already allowed by the declaration. Neither half of that is
  # an error, and between them they kept the bot silent from the day it was
  # configured. `mcp` carries an upper bound on purpose, so a major release
  # arrives as a pull request to look at rather than as a resolution nobody
  # chose.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # The actions the workflows pin by major version.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # The base image of the Dockerfile. An out-of-date base is not a build
  # failure and never announces itself: it is unpatched system packages
  # inside something people pull and run. Nothing else here would notice.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
