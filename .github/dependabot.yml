version: 2
# Minor and patch updates arrive as one pull request per ecosystem and week
# instead of one each. With every action and image pinned exactly, each
# patch is a pull request, and a single run of the gates covers them
# together. A major update still comes on its own, since that is where
# behaviour changes and it wants its own review.
updates:
  # `uv`, not `pip`, because uv.lock is what actually pins a version here,
  # and the pip ecosystem does not read that file.
  #
  # Every runtime dependency sits in a patch window. A release inside it
  # changes uv.lock only, so an update does not raise the floor for whoever
  # installs this package, and one past it moves the window, as `~=` again.
  # Left to itself Dependabot takes this project for a library, since its
  # description matches PyPI, and widens to a range over two minors, which is
  # no patch window any more. The option exists for this ecosystem alone
  # among the three here.
  - package-ecosystem: "uv"
    directory: "/"
    versioning-strategy: "increase-if-necessary"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
        # Always alone, whatever the size of the bump: a minor of any of the
        # six moves its window and needs its own check before a release takes
        # it to everyone, and the suite does not see what the SDK changes, so
        # mcp needs the stdio comparison of CLAUDE.md.
        exclude-patterns: ["mcp", "httpx", "pydantic", "platformdirs", "pypdfium2", "jinja2"]

  # The actions the workflows use, each pinned to a commit with its version
  # in a comment beside it. Dependabot reads the comment and raises the
  # commit and the comment together, so every release, patches included,
  # arrives as a pull request - which is the price of a pin a publisher
  # cannot move.
  #
  # It also retires a special case: astral-sh/setup-uv stopped publishing
  # major tags after v7, so it alone had to name an exact version. With
  # every action pinned exactly, all of them are in the same position.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # The images of the Dockerfile, python and uv, pinned by digest beside
  # their tag. An out-of-date base is not a build failure and never
  # announces itself: it is unpatched system packages inside something
  # people pull and run. With the digest pinned, this is the only way a
  # patch to them arrives.
  - package-ecosystem: "docker"
    directory: "/containers/images/lexware-office-mcp"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
